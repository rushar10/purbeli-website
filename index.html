<style>
body{margin:0;background:#140C0B}
a{color:#F3E7DC}a:hover{color:#D99A35}
.pb *{box-sizing:border-box}
.scene-wrap{position:relative;width:680px;height:640px;flex:0 0 auto;perspective:1300px}
.ring-par{position:absolute;left:0;top:-20px;width:680px;height:680px;will-change:transform}
.ring-svg{display:block;width:680px;height:680px;animation:sway 14s ease-in-out infinite;transform-origin:50% 50%}
.fb{position:absolute;left:110px;top:90px;width:460px;height:460px;transition:opacity .6s ease;will-change:transform;transform-style:preserve-3d}
.face{position:absolute;inset:0;transition:opacity .2s linear}
.face img{display:block;width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.orbit-line{position:absolute;left:50px;top:250px;width:580px;height:150px;border-radius:50%;border:1px solid rgba(217,154,53,.5);pointer-events:none}
.gl{position:absolute;left:0;top:0;width:680px;height:640px;display:block;opacity:0;transition:opacity .8s ease}
.lb3{position:absolute;display:flex;flex-direction:column;align-items:center;gap:12px;white-space:nowrap;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#CDB8AA;text-shadow:0 2px 10px rgba(0,0,0,.85);transform:translate(-50%, calc(-100% + 5px));transition:color .35s ease;background:none;border:0;padding:8px 6px;font:inherit;font-size:12px;cursor:pointer}
.lb3:hover{color:#F3E7DC}
.tapHint{display:none}
@media (hover:none){.tapHint{display:block}}
.lb3.on{color:#D99A35}
.lb3 .dot{transition:transform .35s ease}
.lb3.on .dot{transform:scale(1.5)}
.lb3 .dot{width:10px;height:10px;border-radius:50%;background:#D99A35;box-shadow:0 0 12px rgba(217,154,53,.85)}
.steam-anchor{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.steam{position:absolute;width:16px;height:150px;border-radius:16px;background:linear-gradient(to top,rgba(255,250,244,0),rgba(255,250,244,.3) 45%,rgba(255,250,244,0));filter:blur(8px);animation:rise 5.5s ease-in-out infinite;opacity:0}
.still .ring-svg,.still .steam{animation-play-state:paused}
@keyframes sway{0%,100%{transform:rotateY(-14deg) rotateZ(-3deg)}50%{transform:rotateY(14deg) rotateZ(3deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scaleX(1)}35%{opacity:.85}100%{opacity:0;transform:translateY(-100px) scaleX(2.4)}}
@media (prefers-reduced-motion: reduce){.ring-svg,.steam{animation:none!important}}
@media (max-width:720px){.scene-wrap{transform:scale(.52);margin:-150px -160px}}
@media (max-width:640px){.pb .nl{display:none}.pb .aside{text-align:center!important;align-items:center!important;max-width:none!important}}
</style>
</head>
