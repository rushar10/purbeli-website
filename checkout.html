<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup checkout – Purbeli</title>
<meta name="description" content="Purbeli – Flavour on Wheels. Nepalese momo, chowmein, laphing, chatpate and more at 33 Glenroy Road, Glenroy VIC. Order online for pickup.">
<link rel="icon" href="img/purbeli-logo-cream.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#140C0B}
a{color:#F3E7DC}a:hover{color:#D99A35}
.mn *{box-sizing:border-box}
.mn input,.mn textarea,.mn select,.mn button{font:inherit}
.mn input:focus-visible,.mn textarea:focus-visible,.mn select:focus-visible,.mn button:focus-visible,.mn a:focus-visible{outline:2px solid #D99A35;outline-offset:2px}
.mn .fld{min-height:48px;padding:0 16px;border-radius:12px;background:#140C0B;border:1px solid #3A211D;color:#F3E7DC}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">

<div class="mn" style="background: #140C0B; color: #F3E7DC; font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 1.55; min-height: 100vh">

<header style="background: #140C0B; border-bottom: 1px solid #2A1916">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" aria-label="Purbeli home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<img src="img/purbeli-logo-cream.png" alt="Purbeli logo" style="display: block; width: 64px; height: 55px; object-fit: contain">
<span style="display: flex; flex-direction: column; line-height: 1.2">
<span style="font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #BFA99B">Flavour on Wheels</span>
<span style="font-family: 'Playfair Display', serif; font-size: 20px">Purbeli</span>
</span>
</a>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #BFA99B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Secure checkout</span>
</div>
</header>

<div style="max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<a href="cart.html" aria-label="Back to cart" style="width: 44px; height: 44px; border-radius: 50%; background: #1E1210; border: 1px solid #3A211D; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 36px"><em style="color: #E07A6A">Checkout</em></h1>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">
<form onSubmit="{{noSubmit}}" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<fieldset style="margin: 0; border-radius: 20px; background: #1E1210; border: 1px solid #2E1B17; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-family: 'Playfair Display', serif; font-size: 22px">Your details</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Full name<input class="fld" type="text" autocomplete="name" placeholder="Enter your full name" required></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Phone<input class="fld" type="tel" autocomplete="tel" placeholder="04XX XXX XXX" required></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Email<input class="fld" type="email" autocomplete="email" placeholder="For your receipt and order updates" required></label>
</fieldset>

<fieldset style="margin: 0; border-radius: 20px; background: #1E1210; border: 1px solid #2E1B17; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-family: 'Playfair Display', serif; font-size: 22px">Pickup time</legend>
<div role="group" aria-label="When" style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" onClick="{{pickAsap}}" aria-pressed="{{asapPressed}}" style="{{asapStyle}}">As soon as possible</button>
<button type="button" onClick="{{pickLater}}" aria-pressed="{{laterPressed}}" style="{{laterStyle}}">Schedule for later</button>
</div>
<sc-if value="{{isAsap}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 14px; color: #BFA99B">Ready in about [prep time] after the kitchen accepts it.</p></sc-if>
<sc-if value="{{isLater}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Pickup slot<select class="fld"><option>[Slots from opening hours]</option></select></label>
<p style="margin: 0; padding: 10px 14px; border-radius: 12px; background: #2A1310; border: 1px solid #8E2B27; font-size: 13px; color: #F6D9CF">If a slot fills up before you finish, we’ll ask you to choose another time.</p>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Order notes (optional)<textarea class="fld" rows="2" placeholder="Anything about the whole order" style="padding: 12px 16px; resize: vertical"></textarea></label>
</fieldset>

<fieldset style="margin: 0; border-radius: 20px; background: #1E1210; border: 1px solid #2E1B17; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-family: 'Playfair Display', serif; font-size: 22px">Payment</legend>
<button type="button" onClick="{{pickCard}}" aria-pressed="{{cardPressed}}" style="{{cardStyle}}">
<span style="width: 46px; height: 46px; border-radius: 14px; background: #2A1916; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D99A35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; text-align: left"><strong style="font-size: 16px">Pay online by card</strong><span style="font-size: 13px; color: #BFA99B">Secure payment through Stripe in AUD</span></span>
<span style="{{cardDot}}"></span>
</button>
<button type="button" onClick="{{pickCash}}" aria-pressed="{{cashPressed}}" style="{{cashStyle}}">
<span style="width: 46px; height: 46px; border-radius: 14px; background: #2A1916; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D99A35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 9.5v5M18 9.5v5"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; text-align: left"><strong style="font-size: 16px">Pay Cash at Pickup</strong><span style="font-size: 13px; color: #BFA99B">Pay in cash when you collect. The restaurant may confirm first.</span></span>
<span style="{{cashDot}}"></span>
</button>
</fieldset>
</form>

<aside aria-label="Order summary" style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="border-radius: 20px; background: #1E1210; border: 1px solid #2E1B17; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0 0 4px; font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 400">Your order</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: #140C0B"><img src="img/cut-momo.webp" alt="" style="width: 52px; height: 52px; object-fit: contain; flex: 0 0 auto"><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 13px; text-transform: uppercase">2 × Momo</strong><span style="font-size: 12px; color: #BFA99B">Chicken · Steamed</span></span><span style="font-size: 13px; font-weight: 700; color: #D99A35">$29.98</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: #140C0B"><img src="img/plate-hq.webp" alt="" style="width: 52px; height: 52px; object-fit: contain; flex: 0 0 auto"><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 13px; text-transform: uppercase">1 × Pani Puri</strong><span style="font-size: 12px; color: #BFA99B">Extra pani on the side</span></span><span style="font-size: 13px; font-weight: 700; color: #D99A35">$9.99</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: #140C0B"><img src="img/aloo-plate.webp" alt="" style="width: 52px; height: 52px; object-fit: contain; flex: 0 0 auto"><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 13px; text-transform: uppercase">1 × Aalu Chop</strong></span><span style="font-size: 13px; font-weight: 700; color: #D99A35">$8.99</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: #140C0B"><img src="img/noodle-plate.webp" alt="" style="width: 52px; height: 52px; object-fit: contain; flex: 0 0 auto"><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><strong style="font-size: 13px; text-transform: uppercase">1 × Keema Noodles</strong><span style="font-size: 12px; color: #BFA99B">Chicken</span></span><span style="font-size: 13px; font-weight: 700; color: #D99A35">$14.99</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 6px 0; font-size: 14px">
<div style="display: flex; justify-content: space-between; color: #BFA99B"><span>Subtotal</span><span>$63.95</span></div>
<div style="display: flex; justify-content: space-between; color: #BFA99B"><span>Pickup</span><span>Free</span></div>
<div style="display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid #3A211D; font-weight: 800; font-size: 17px"><span>Total</span><span>$63.95 AUD</span></div>
</div>
</div>
<div style="border-radius: 20px; background: #1E1210; border: 1px solid #2E1B17; padding: 14px 14px 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 12px; color: #BFA99B">{{payLabel}}</span><strong style="font-size: 22px">$63.95</strong></span>
<a href="order.html" style="flex: 1; max-width: 210px; display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #9E2F2A; color: #FFF8EF; text-decoration: none; font-weight: 700">{{cta}}</a>
</div>
<p style="margin: 0; text-align: center; font-size: 12px; color: #9C8678">{{ctaNote}}</p>
</aside>
</div>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-script" data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var pay = st.pay || 'card';
var when = st.when || 'asap';
var pill = function (on) { return 'min-height: 44px; padding: 0 20px; border-radius: 999px; cursor: pointer; font-weight: 700; border: 1px solid ' + (on ? '#D99A35' : '#3A211D') + '; background: ' + (on ? '#D99A35' : '#140C0B') + '; color: ' + (on ? '#1A0F0D' : '#F3E7DC'); };
var opt = function (on) { return 'display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border-radius: 16px; cursor: pointer; color: #F3E7DC; background: ' + (on ? '#2A1714' : '#140C0B') + '; border: 1px solid ' + (on ? '#D99A35' : '#3A211D'); };
var dot = function (on) { return 'width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; border: 2px solid ' + (on ? '#D99A35' : '#6B3A33') + '; box-shadow: inset 0 0 0 4px #140C0B; background: ' + (on ? '#D99A35' : 'transparent'); };
return {
isAsap: when === 'asap', isLater: when === 'later',
asapStyle: pill(when === 'asap'), laterStyle: pill(when === 'later'),
asapPressed: when === 'asap' ? 'true' : 'false', laterPressed: when === 'later' ? 'true' : 'false',
pickAsap: function () { self.setState({ when: 'asap' }); },
pickLater: function () { self.setState({ when: 'later' }); },
cardStyle: opt(pay === 'card'), cashStyle: opt(pay === 'cash'),
cardDot: dot(pay === 'card'), cashDot: dot(pay === 'cash'),
cardPressed: pay === 'card' ? 'true' : 'false', cashPressed: pay === 'cash' ? 'true' : 'false',
pickCard: function () { self.setState({ pay: 'card' }); },
pickCash: function () { self.setState({ pay: 'cash' }); },
payLabel: pay === 'card' ? 'Pay now' : 'Pay at pickup',
cta: pay === 'card' ? 'Pay $63.95 securely' : 'Place order',
ctaNote: pay === 'card' ? 'You’ll finish payment on Stripe’s secure page.' : 'Your order stays unpaid until you pay staff at pickup.',
noSubmit: function (e) { if (e && e.preventDefault) e.preventDefault(); }
};
}
}
</script>
<script src="js/morphdom.min.js"></script>
<script src="js/dc-lite.js"></script>
</body>
</html>
